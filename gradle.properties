# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable AndroidX
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the resources
# declared in the library itself and none from the library's dependencies, thereby reducing the
# size of the R class for that library
android.nonTransitiveRClass=true

# Enable build config fields
android.defaults.buildfeatures.buildconfig=true
